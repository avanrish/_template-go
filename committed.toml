style = "conventional"
# LINT.IfChange(commit_subject)
subject_capitalized = true
subject_length = 50
# LINT.ThenChange(//AGENTS.md:commit_subject)
# The Conventional Commits types that cliff.toml groups: committed's default
# list lacks build, ci and revert.
# LINT.IfChange(commit_types)
allowed_types = [
  "build",
  "chore",
  "ci",
  "docs",
  "feat",
  "fix",
  "perf",
  "refactor",
  "revert",
  "style",
  "test",
]
# LINT.ThenChange(//cliff.toml:commit_types)
ignore_author_re = "renovate"
merge_commit = true
