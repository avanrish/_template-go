style = "conventional"
# LINT.IfChange(commit_subject)
subject_capitalized = true
subject_length = 50
# LINT.ThenChange(//AGENTS.md:commit_subject)
# committed's default list lacks build, ci and revert.
allowed_types = [
  "build",
  "chore",
  "ci",
  "docs",
  "feat",
  "fix",
  "perf",
  "refactor",
  "revert",
  "style",
  "test",
]
ignore_author_re = "renovate"
merge_commit = true
