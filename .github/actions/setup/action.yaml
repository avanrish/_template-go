name: Setup
description: Install Go and the development tools pinned in mise.toml, plus the CI-only tools in mise.ci.toml.
runs:
  using: composite
  steps:
    - name: Use the CI mise environment
      shell: bash
      run: echo "MISE_ENV=ci" >> "$GITHUB_ENV"
    - name: Install tools through mise
      uses: jdx/mise-action@6be3c7ed4c21d4f76b208d351d95aac273ebb76d # v5.2.4
      with:
        version: "2026.10.21" # MISE_VERSION
