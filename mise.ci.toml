# Tools only CI needs; the setup action sets MISE_ENV=ci to load this file on
# top of mise.toml.
[tools]
# ifttt-lint publishes no Windows binary; the Windows test job does not need it.
"github:simonepri/ifttt-lint" = { version = "0.11.3", os = ["linux", "macos"] }
gitleaks = "8.30.1"
typos = "1.51.1"
